<VirtualHost *:80>
    ServerName raastdemo.paysyslabs.com
    Alias /.well-known/acme-challenge/ /backupfiles/raastdemo/acme/.well-known/acme-challenge/
    <Directory /backupfiles/raastdemo/acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://raastdemo.paysyslabs.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
