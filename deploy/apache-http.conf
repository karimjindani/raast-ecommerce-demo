<VirtualHost *:80>
    ServerName raastdemo.paysyslabs.com
    Alias /.well-known/acme-challenge/ /backupfiles/raastdemo/acme/.well-known/acme-challenge/
    <Directory /backupfiles/raastdemo/acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPreserveHost On
    RequestHeader set X-Raast-Client-IP "expr=%{REMOTE_ADDR}"
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    LimitRequestBody 16384
</VirtualHost>
